services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: portfolio_db
      POSTGRES_USER: lucas
      POSTGRES_PASSWORD: lucas
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
